version: '3.8'

services:
  db:
    image: postgres:16.3
    environment:
      POSTGRES_DB: oasis_db
      POSTGRES_USER: oasis_user
      POSTGRES_PASSWORD: oasis_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:5496
    volumes:
      - .:/app
    ports:
      - "5496:5496"
    environment:
      - POSTGRES_DB=oasis_db
      - POSTGRES_USER=oasis_user
      - POSTGRES_PASSWORD=oasis_pass
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db

volumes:
  postgres_data: