<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="60%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
  </defs>
  <!-- Sky / Sun -->
  <circle cx="32" cy="28" r="24" fill="url(#sky)" rx="24"/>
  <!-- Water / Oasis -->
  <ellipse cx="32" cy="42" rx="22" ry="7" fill="url(#water)"/>
  <!-- Sand / Island -->
  <ellipse cx="32" cy="44" rx="14" ry="4" fill="#d97706"/>
  <!-- Palm trunk -->
  <path d="M32 44 Q31 30 32 18" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Palm leaves -->
  <path d="M32 18 Q22 14 14 18" stroke="#15803d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M32 18 Q24 10 18 10" stroke="#15803d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M32 18 Q28 8 28 4" stroke="#15803d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M32 18 Q36 8 36 4" stroke="#15803d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M32 18 Q40 10 46 10" stroke="#15803d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M32 18 Q42 14 50 18" stroke="#15803d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Water reflection lines -->
  <line x1="22" y1="42" x2="26" y2="42" stroke="#a5f3fc" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="36" y1="43" x2="42" y2="43" stroke="#a5f3fc" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="28" y1="44" x2="33" y2="44" stroke="#a5f3fc" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
</svg>
